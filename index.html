<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso de Informática Básica EIPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Plan: aula de adultos que empiezan de cero. Letra muy legible, azul de pantalla + amarillo de aviso.
   Layout: índice de unidades a la izquierda, unidad a la derecha; en móvil, una sola columna. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#e3eaf2; --ink:#13202c; --muted:#4b5a69;
  --accent:#0a58a8; --accent-ink:#ffffff; --mark:#f2b705; --line:#cfd9e3;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5;
  --font-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1620; --surface:#16212d; --surface-2:#1f2d3c; --ink:#e7eef5; --muted:#a6b4c2;
    --accent:#6cb0ff; --accent-ink:#0b1a2a; --mark:#f5c842; --line:#2b3c4e;
    --ok:#6fd496; --ok-bg:#163223; --bad:#ff8a80; --bad-bg:#3a1d1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1620; --surface:#16212d; --surface-2:#1f2d3c; --ink:#e7eef5; --muted:#a6b4c2;
  --accent:#6cb0ff; --accent-ink:#0b1a2a; --mark:#f5c842; --line:#2b3c4e;
  --ok:#6fd496; --ok-bg:#163223; --bad:#ff8a80; --bad-bg:#3a1d1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:18px}
html.big{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.12rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.en{display:block;color:var(--muted);font-style:italic;font-size:.9em;margin-top:.15em}
.en::before{content:"EN · ";font-style:normal;font-weight:700;font-size:.75em;letter-spacing:.04em;color:var(--accent)}
.en-inline{color:var(--muted);font-style:italic;font-weight:400;font-size:.8em}
body.no-en .en, body.no-en .en-inline, body.no-en .svg-en{display:none}

/* Cabecera */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--font-display);font-size:1.05rem}
.brand small{display:block;color:var(--muted);font-size:.78rem}
.logo{width:38px;height:38px;flex:none}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-bar{width:90px;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ok)}

/* Estructura */
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
aside{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.nav-toggle{display:none}
.nav-block{margin-bottom:10px}
.nav-block > p{font-family:var(--font-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px 2px}
.nav-block .en{font-size:.75rem;text-transform:none;letter-spacing:0}
.nav-link{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.93rem}
.nav-link:hover{background:var(--surface-2)}
.nav-link.cur{background:var(--accent);color:var(--accent-ink)}
.nav-link.cur .en{color:inherit;opacity:.85}
.nav-link.cur .en::before{color:inherit}
.nav-num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.nav-link.done .nav-num{background:var(--ok);color:#fff}
.nav-link .en{font-size:.78rem}
main{min-width:0}
@media (max-width: 900px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none}
  .nav-toggle{display:block;width:100%;text-align:left;border:0;background:none;font-family:var(--font-display);font-size:1rem;padding:4px}
  aside:not(.open) .nav-list{display:none}
  .brand small{display:none}
}

/* Inicio */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:2.3rem}
.hero .lead{font-size:1.12rem;margin-top:10px;max-width:60ch}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 18px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step b{display:block;font-family:var(--font-display);color:var(--accent);font-size:1.4rem}
.bloque{margin-top:26px}
.bloque > h2{margin-bottom:12px}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ucard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink)}
.ucard:hover{border-color:var(--accent)}
.ucard.done{border-left-color:var(--ok)}
.ucard .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.ucard h3{font-size:1.05rem}
.tag{display:inline-block;font-size:.75rem;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--muted);font-weight:700}
@media (max-width: 760px){
  .hero{grid-template-columns:1fr;padding:20px}
  .hero h1{font-size:1.8rem}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Unidad */
.unit-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.unit-head h1{margin-top:4px}
.unit-head .h1en{font-size:1.1rem}
.goal{margin-top:12px;padding:10px 14px;background:var(--surface-2);border-radius:10px;border-left:5px solid var(--mark)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.devsel{display:flex;border:2px solid var(--accent);border-radius:10px;overflow:hidden}
.devsel button{border:0;background:transparent;padding:7px 14px;font-weight:700;color:var(--accent)}
.devsel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.small-note{font-size:.82rem;color:var(--muted)}
section.part{margin-top:26px}
section.part > h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.pnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--mark);color:#1b1400;font-size:1.05rem;flex:none}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.learn.has-img{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.learn-text{display:flex;flex-direction:column;gap:8px;max-width:68ch}
.learn-text p{font-size:1.02rem}
.terms{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.terms li{padding:8px 12px;background:var(--surface-2);border-radius:8px}
.dev-only{display:none;border:2px dashed var(--accent);border-radius:10px;padding:10px 12px}
body.dev-android .dev-only.android, body.dev-iphone .dev-only.iphone{display:block}
.devtag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 8px;margin-bottom:4px}
.listen{align-self:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 12px;font-size:.85rem}
.fig{margin:0}
.fig svg{width:100%;height:auto;display:block}
@media (max-width: 760px){ .learn.has-img{grid-template-columns:1fr} }
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:0}
.words > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.words dt{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.words dd{margin:4px 0 0}
.sub{font-family:var(--font-display);font-size:1.05rem;margin:18px 0 10px}

/* Ejercicios */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt,.sbtn{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px}
.opt:hover,.sbtn:hover{border-color:var(--accent)}
.opt.ok,.sbtn.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad,.sbtn.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{margin-top:8px;font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb .en{font-weight:400}
.sort{display:grid;gap:10px}
.sort-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sort-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.instr{font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.check input{width:26px;height:26px;flex:none;accent-color:var(--ok);margin:2px 0 0}
.check.on{border-color:var(--ok);background:var(--ok-bg)}
.finish{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:28px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.donebtn{border:2px solid var(--ok);background:var(--surface);color:var(--ok);border-radius:10px;padding:10px 18px;font-weight:700}
.donebtn[aria-pressed="true"]{background:var(--ok);color:#fff}

/* Simuladores */
.sim-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width: 760px){ .sim-grid{grid-template-columns:1fr} }
.sim-cell{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.sim-cell.done{border-color:var(--ok)}
.task{font-weight:700}
.task .en{font-weight:400}
.pad{position:relative;height:190px;background:var(--surface-2);border-radius:10px;overflow:hidden;user-select:none;-webkit-user-select:none}
.pad.center{display:grid;place-items:center}
.st{min-height:1.5em;font-weight:700;color:var(--ok)}
.st.hint{color:var(--muted);font-weight:400}
.target{position:absolute;left:40%;top:35%;width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ico{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:8px;cursor:default;touch-action:manipulation}
.ico svg{width:72px;height:72px}
.ico span{font-size:.9rem}
.ico.sel{background:rgba(10,88,168,.18)}
.ctx{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;flex-direction:column;min-width:160px;z-index:3}
.ctx button{border:0;background:none;text-align:left;padding:8px 14px}
.ctx button:hover{background:var(--surface-2)}
.paper{position:absolute;left:14%;top:30%;width:70px;touch-action:none;cursor:grab}
.paper svg{width:70px;height:70px;display:block}
.bin{position:absolute;right:12%;top:26%;width:86px}
.bin svg{width:86px;height:86px;display:block}
.bin.hot{outline:3px dashed var(--ok);border-radius:10px}
.kb-task{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.kb-task.done{border-color:var(--ok)}
.kb-task input{width:100%;font:inherit;font-size:1.15rem;padding:10px 12px;margin-top:8px;border:2px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.kb-task.done input{border-color:var(--ok)}
.touchbtn{width:150px;height:110px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;touch-action:manipulation;-webkit-touch-callout:none}
.touchbtn.pressing{transform:scale(.96);filter:brightness(1.1)}
.swipe{position:absolute;inset:14px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-size:1.3rem;color:#fff;touch-action:pan-y;cursor:grab;transition:background .2s}
.win-stage{position:relative;height:300px;background:linear-gradient(160deg,#2f6fb3,#1c4a7d);border-radius:10px;overflow:hidden}
.win{position:absolute;left:12%;top:10%;width:62%;height:60%;background:#fff;color:#13202c;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.win[data-state="max"]{left:0;top:0;width:100%;height:calc(100% - 44px);border-radius:0}
.win[data-state="min"],.win[data-state="closed"]{display:none}
.win-bar{display:flex;align-items:center;justify-content:space-between;background:#e9eef4;padding-left:10px;font-size:.85rem}
.win-btns{display:flex}
.win-btns button{border:0;background:none;width:46px;height:34px;color:#13202c;font-size:1rem}
.win-btns button:hover{background:#d3dbe4}
.win-btns button[data-w="close"]:hover{background:#c42b1c;color:#fff}
.win-body{padding:12px;font-family:Consolas,monospace;font-size:.9rem}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(240,244,248,.92);display:flex;justify-content:center;align-items:center;gap:6px}
.taskbar button{width:40px;height:36px;border:0;border-radius:6px;background:none;display:grid;place-items:center;color:#13202c}
.taskbar button:hover{background:rgba(0,0,0,.08)}
.taskbar .tb-app.open{border-bottom:3px solid #0a58a8}
.tasklist{display:grid;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.tasklist li{padding:8px 12px;border-radius:8px;background:var(--surface);border:2px solid var(--line)}
.tasklist li.done{border-color:var(--ok);background:var(--ok-bg)}
.tasklist li.done::before{content:"✔ ";color:var(--ok);font-weight:700}
.pw input{width:100%;font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.meter{height:14px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:12px 0 6px}
.meter i{display:block;height:100%;width:0;transition:width .2s}
.pw-label{font-weight:700}
.crit{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}
.crit li::before{content:"○ ";color:var(--muted)}
.crit li.on::before{content:"✔ ";color:var(--ok)}

/* Guía */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.prose h2{margin:22px 0 8px} .prose h2:first-child{margin-top:0}
.prose p,.prose li{max-width:72ch}
.prose ul{padding-left:1.2em}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}

/* Fichas imprimibles */
#print-area{display:none}
.ficha{background:#fff;color:#111;font-family:var(--font-body);font-size:12.5pt;line-height:1.45;padding:0 0 10px}
.cuaderno .ficha{border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:22px}
.ficha .en{color:#555}
.ficha .en::before{color:#0a58a8}
.f-head{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #0a58a8;padding-bottom:8px;margin-bottom:12px}
.f-eyebrow{font-size:9.5pt;color:#555;font-weight:700}
.ficha h2{font-size:17pt;color:#111}
.ficha h3{font-size:12.5pt;margin:14px 0 6px;color:#0a58a8}
.f-id p{white-space:nowrap;margin-bottom:6px}
.f-match{width:100%;border-collapse:collapse}
.f-match td{padding:4px 6px;vertical-align:top;width:50%}
.f-q{margin-bottom:8px;break-inside:avoid}
.f-q p{margin-bottom:2px}
.f-opt{display:block;padding-left:18px}
.f-tbl{width:100%;border-collapse:collapse}
.f-tbl td,.f-tbl th{border:1px solid #999;padding:5px 7px;text-align:left}
.f-tbl th{background:#eef2f6}
.f-lines div{border-bottom:1px solid #999;height:28px}
.f-sol{break-before:page;page-break-before:always}
.f-sol h2{font-size:15pt}
.f-sol .sol-u{margin-bottom:12px;break-inside:avoid}
.box{font-family:Arial,sans-serif}
@media print{
  @page{size:A4;margin:14mm}
  html{font-size:12pt}
  body{background:#fff}
  .top,aside,.no-print{display:none !important}
  .wrap{display:block;padding:0;max-width:none}
  body.printing main{display:none}
  body.printing #print-area{display:block}
  .cuaderno .ficha{border:0;padding:0;margin:0;break-after:page;page-break-after:always}
  .cuaderno .ficha:last-child{break-after:auto}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body class="dev-android">
<header class="top">
  <div class="top-in">
    <a class="brand" href="#inicio">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="6" width="26" height="18" rx="3" fill="#0a58a8"/><rect x="13" y="24" width="6" height="5" fill="#0a58a8"/><rect x="9" y="29" width="14" height="3" rx="1.5" fill="#0a58a8"/><rect x="25" y="14" width="13" height="23" rx="3" fill="#f2b705" stroke="#13202c" stroke-width="1.5"/><circle cx="31.5" cy="33" r="1.4" fill="#13202c"/></svg>
      <span><b>Informática básica</b><small>EIPA · Ordenador y móvil</small></span>
    </a>
    <div class="ctrls">
      <button class="chip" id="t-en" aria-pressed="true" title="Mostrar u ocultar los subtítulos en inglés">English subtitles</button>
      <button class="chip" id="t-big" aria-pressed="false">Letra grande</button>
      <a class="chip" href="#guia" style="text-decoration:none;color:inherit">Guía docente</a>
      <span class="prog" title="Unidades terminadas"><span class="prog-bar"><i id="prog-i"></i></span><span id="prog-t">0/16</span></span>
    </div>
  </div>
</header>
<div class="wrap">
  <aside id="aside">
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false">☰ Unidades del curso <span class="en-inline">Course units</span></button>
    <nav class="nav-list" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<div id="print-area"></div>

<script>
/* ---------- Ilustraciones ---------- */

   {h:["La arroba y los signos","The @ sign and punctuation"], p:["La <b>@</b>: mantenga pulsada <b>AltGr</b> (a la derecha de la barra espaciadora) y pulse el <b>2</b>. Los signos <b>¿</b> y <b>¡</b> están en la segunda tecla a la derecha del 0 (¿ con Mayús). El <b>?</b> se escribe con Mayús y la tecla de al lado del 0.","<b>@</b>: hold down <b>AltGr</b> (to the right of the space bar) and press <b>2</b>. The signs <b>¿</b> and <b>¡</b> are on the second key to the right of 0 (¿ with Shift). <b>?</b> is Shift plus the key next to 0."]}
  ],
  words:[["Cursor","La rayita que parpadea donde se escribe.","Cursor","The blinking line where you type."],["Mayús","Tecla para escribir una mayúscula.","Shift","Key to type a capital letter."],["Retroceso","Tecla que borra hacia la izquierda.","Backspace","Key that deletes to the left."],["Enter","Tecla para pasar de línea o aceptar.","Enter","Key to go to a new line or accept."],["AltGr","Tecla para la @ (AltGr + 2).","AltGr","Key for @ (AltGr + 2)."],["Barra espaciadora","La tecla larga que pone espacios.","Space bar","The long key that adds spaces."]],
  quiz:[
   {q:["Para borrar la letra de la izquierda pulso…","To delete the letter on the left I press…"], o:[["Retroceso","Backspace"],["Enter","Enter"],["Esc","Esc"]], w:["Retroceso borra hacia atrás.","Backspace deletes backwards."]},
   {q:["La @ se escribe con…","The @ sign is typed with…"], o:[["AltGr + 2","AltGr + 2"],["Mayús + 2","Shift + 2"],["Ctrl + A","Ctrl + A"]], w:["En el teclado español, la @ está en el 2 con AltGr.","On a Spanish keyboard, @ is on the 2 key with AltGr."]},
   {q:["Para escribir una sola mayúscula…","To type one capital letter…"], o:[["Mantengo Mayús y pulso la letra","I hold Shift and press the letter"],["Pulso Enter dos veces","I press Enter twice"],["Pulso la barra espaciadora","I press the space bar"]], w:["Bloq Mayús es para escribir todo en mayúsculas.","Caps Lock is for typing everything in capitals."]}],
  practice:[["Abra el Bloc de notas: pulse Inicio, escriba «bloc» y pulse Enter.","Open Notepad: press Start, type «bloc» and press Enter."],["Escriba su nombre y su municipio, con mayúscula al principio.","Type your name and your town, with a capital letter at the beginning."],["Escriba tres palabras con tilde, por ejemplo: café, autobús, teléfono.","Type three words with accents, for example: café, autobús, teléfono."],["Escriba una dirección de correo inventada con @.","Type a made-up email address with @."],["Borre una palabra con Retroceso y vuelva a escribirla.","Delete a word with Backspace and type it again."]]
},
{ id:"u4", b:"B", dev:"pc", t:["Encender, apagar y el escritorio","Turning on, shutting down and the desktop"],
  goal:["Encender el ordenador, conocer el escritorio y apagarlo bien.","Turn on the computer, get to know the desktop and shut it down properly."],
  learn:[
   {h:["Encender e iniciar sesión","Turning on and signing in"], p:["Pulse el botón de encendido (⏻) de la torre o del portátil y espere: Windows tarda un poco. Aparece la pantalla de bloqueo. Haga clic o pulse una tecla y escriba su contraseña o PIN. En el aula, su docente le dirá cuál usar.","Press the power button (⏻) on the tower or laptop and wait: Windows takes a little while. The lock screen appears. Click or press a key and type your password or PIN. In class, your teacher will tell you which one to use."]},
   {h:["El escritorio","The desktop"], img:"desktop", p:["Es la pantalla principal. Tiene <b>iconos</b>, dibujos pequeños que abren programas o carpetas. Abajo está la <b>barra de tareas</b>: en el centro, el botón <b>Inicio</b> (el logo de Windows) y los programas; a la derecha, la hora, el wifi y el volumen.","It is the main screen. It has <b>icons</b>, small pictures that open programs or folders. At the bottom is the <b>taskbar</b>: in the middle, the <b>Start</b> button (the Windows logo) and programs; on the right, the clock, wifi and volume."]},
   {h:["El menú Inicio","The Start menu"], p:["Haga clic en Inicio y se abre un menú con los programas. Arriba hay un buscador: escriba el nombre del programa, por ejemplo «calculadora», y pulse Enter.","Click Start and a menu with the programs opens. At the top there is a search box: type the program's name, for example «calculadora», and press Enter."]},
   {h:["Apagar bien","Shutting down properly"], list:[
     ["Apagar:","Inicio → botón ⏻ → Apagar. No lo apague quitando el cable: se pueden perder cosas.","Shut down:","Start → ⏻ button → Shut down. Do not pull out the cable: you can lose things."],
     ["Reiniciar:","se apaga y se enciende solo. Ayuda cuando algo va mal.","Restart:","it turns off and on by itself. It helps when something goes wrong."],
     ["Suspender:","el ordenador descansa sin apagarse del todo.","Sleep:","the computer rests without turning off completely."]]}
  ],
  words:[["Iniciar sesión","Entrar con su usuario y contraseña.","Sign in","Enter with your user and password."],["Escritorio","La pantalla principal de Windows.","Desktop","The main Windows screen."],["Icono","Dibujo pequeño que abre algo.","Icon","A small picture that opens something."],["Barra de tareas","La franja de abajo con Inicio y la hora.","Taskbar","The strip at the bottom with Start and the clock."],["Menú Inicio","El menú con todos los programas.","Start menu","The menu with all the programs."],["Reiniciar","Apagar y encender de nuevo.","Restart","Turn off and on again."]],
  quiz:[
   {q:["¿Cómo se apaga bien el ordenador?","How do you shut down the computer properly?"], o:[["Inicio → ⏻ → Apagar","Start → ⏻ → Shut down"],["Quitando el cable","Pulling out the cable"],["Apagando la pantalla","Turning off the screen"]], w:["Así Windows cierra todo con cuidado.","This way Windows closes everything carefully."]},
   {q:["¿Dónde se ve la hora?","Where can you see the time?"], o:[["A la derecha de la barra de tareas","On the right of the taskbar"],["En el menú del ratón","In the mouse menu"],["En el teclado","On the keyboard"]], w:["Abajo a la derecha están la hora, el wifi y el volumen.","Bottom right: clock, wifi and volume."]},
   {q:["Un icono es…","An icon is…"], o:[["Un dibujo pequeño que abre algo","A small picture that opens something"],["Un cable","A cable"],["Una contraseña","A password"]], w:["Los iconos abren programas, carpetas o archivos.","Icons open programs, folders or files."]}],
  practice:[["Encienda el ordenador e inicie sesión.","Turn on the computer and sign in."],["Abra el menú Inicio.","Open the Start menu."],["Escriba «calculadora» en el buscador y ábrala.","Type «calculadora» in the search box and open it."],["Mire la hora y el volumen en la barra de tareas.","Look at the clock and volume on the taskbar."],["Apague el ordenador correctamente.","Shut down the computer properly."]]
},
{ id:"u5", b:"B", dev:"pc", t:["Las ventanas","Windows (on screen)"], sim:"window",
  goal:["Abrir, minimizar, maximizar, cambiar y cerrar ventanas.","Open, minimize, maximize, switch and close windows."],
  learn:[
   {h:["Cada programa, una ventana","Each program, one window"], p:["Cada programa se abre en un recuadro llamado <b>ventana</b>. Se pueden tener varias ventanas abiertas a la vez.","Each program opens in a box called a <b>window</b>. You can have several windows open at the same time."]},
   {h:["Los tres botones","The three buttons"], img:"window", list:[
     ["— Minimizar:","esconde la ventana en la barra de tareas. No la cierra.","— Minimize:","hides the window in the taskbar. It does not close it."],
     ["□ Maximizar:","la ventana ocupa toda la pantalla. Si se pulsa otra vez, vuelve a su tamaño.","□ Maximize:","the window fills the screen. Press again to go back to its size."],
     ["✕ Cerrar:","cierra el programa.","✕ Close:","closes the program."]]},
   {h:["Mover y cambiar de ventana","Moving and switching windows"], list:[
     ["Volver a una ventana:","haga clic en su icono de la barra de tareas.","Go back to a window:","click its icon on the taskbar."],
     ["Mover:","arrastre la barra de título, la franja de arriba.","Move:","drag the title bar, the strip at the top."],
     ["Cambiar el tamaño:","ponga el puntero en el borde; cuando sea una flecha doble, arrastre.","Resize:","put the pointer on the edge; when it becomes a double arrow, drag."],
     ["Truco:","Alt + Tab pasa de una ventana a otra.","Tip:","Alt + Tab switches from one window to another."]]}
  ],
  words:[["Ventana","Recuadro donde funciona un programa.","Window","The box where a program runs."],["Minimizar","Esconder la ventana sin cerrarla.","Minimize","Hide the window without closing it."],["Maximizar","Poner la ventana en toda la pantalla.","Maximize","Make the window fill the screen."],["Cerrar","Terminar el programa.","Close","End the program."],["Barra de título","La franja de arriba de la ventana.","Title bar","The strip at the top of the window."],["Alt + Tab","Teclas para cambiar de ventana.","Alt + Tab","Keys to switch windows."]],
  quiz:[
   {q:["El botón — sirve para…","The — button is for…"], o:[["Esconder la ventana sin cerrarla","Hiding the window without closing it"],["Cerrar el programa","Closing the program"],["Borrar el archivo","Deleting the file"]], w:["La ventana sigue en la barra de tareas.","The window is still in the taskbar."]},
   {q:["El botón ✕ sirve para…","The ✕ button is for…"], o:[["Cerrar","Closing"],["Agrandar","Making it bigger"],["Guardar","Saving"]], w:["✕ cierra el programa. Guarde antes su trabajo.","✕ closes the program. Save your work first."]},
   {q:["Para mover una ventana arrastro…","To move a window I drag…"], o:[["La barra de título","The title bar"],["La hora","The clock"],["El botón Inicio","The Start button"]], w:["La barra de título es la franja de arriba.","The title bar is the strip at the top."]}],
  practice:[["Abra la Calculadora y el Bloc de notas.","Open the Calculator and Notepad."],["Pase de una a otra con la barra de tareas y después con Alt + Tab.","Switch between them with the taskbar and then with Alt + Tab."],["Maximice el Bloc de notas y vuelva a dejarlo como estaba.","Maximize Notepad and put it back as it was."],["Minimice la Calculadora y recupérela.","Minimize the Calculator and bring it back."],["Cierre las dos ventanas.","Close both windows."]]
},
{ id:"u6", b:"B", dev:"pc", t:["Archivos y carpetas","Files and folders"],
  goal:["Guardar, ordenar, copiar y recuperar archivos.","Save, organise, copy and recover files."],
  learn:[
   {h:["Archivo y carpeta","File and folder"], p:["Un <b>archivo</b> es cualquier cosa guardada: un documento, una foto, una canción. Una <b>carpeta</b> es como una caja para ordenar archivos. El final del nombre (.jpg, .pdf, .docx) se llama <b>extensión</b> y dice qué tipo de archivo es.","A <b>file</b> is anything saved: a document, a photo, a song. A <b>folder</b> is like a box to organise files. The end of the name (.jpg, .pdf, .docx) is called the <b>extension</b> and tells you the type of file."]},
   {h:["El Explorador de archivos","File Explorer"], p:["Es el programa para ver sus carpetas: la carpeta amarilla de la barra de tareas, o las teclas <b>Windows + E</b>. Carpetas habituales: <b>Documentos</b>, <b>Imágenes</b>, <b>Descargas</b> (lo que se baja de internet) y <b>Escritorio</b>.","It is the program to see your folders: the yellow folder on the taskbar, or the keys <b>Windows + E</b>. Usual folders: <b>Documents</b>, <b>Pictures</b>, <b>Downloads</b> (what you get from the internet) and <b>Desktop</b>."]},
   {h:["Crear, copiar y cambiar el nombre","Create, copy and rename"], list:[
     ["Crear una carpeta:","clic derecho en un espacio vacío → Nuevo → Carpeta. Escriba el nombre y pulse Enter.","Create a folder:","right-click on an empty space → New → Folder. Type the name and press Enter."],
     ["Copiar y pegar:","clic derecho en el archivo → Copiar. Vaya a otra carpeta → clic derecho → Pegar. Con teclas: Ctrl + C y Ctrl + V.","Copy and paste:","right-click the file → Copy. Go to another folder → right-click → Paste. With keys: Ctrl + C and Ctrl + V."],
     ["Cambiar el nombre:","clic derecho → Cambiar nombre.","Rename:","right-click → Rename."]]},
   {h:["El pendrive y la Papelera","USB stick and Recycle Bin"], p:["El <b>pendrive</b> (memoria USB) se conecta en un puerto USB y aparece en el Explorador. Cierre los archivos antes de quitarlo. Lo que borra va a la <b>Papelera</b>: desde ahí se puede recuperar (clic derecho → Restaurar) mientras no se vacíe.","A <b>USB stick</b> plugs into a USB port and appears in File Explorer. Close the files before removing it. What you delete goes to the <b>Recycle Bin</b>: you can recover it from there (right-click → Restore) while it is not emptied."]}
  ],
  words:[["Archivo","Cualquier cosa guardada: foto, documento…","File","Anything saved: photo, document…"],["Carpeta","Caja para ordenar archivos.","Folder","A box to organise files."],["Explorador de archivos","Programa para ver las carpetas.","File Explorer","Program to see folders."],["Descargas","Carpeta con lo que baja de internet.","Downloads","Folder with what you get from the internet."],["Pendrive","Memoria USB que se lleva en el bolsillo.","USB stick","A memory you carry in your pocket."],["Papelera","Lugar donde va lo que se borra.","Recycle Bin","Where deleted things go."]],
  sort:{ask:["¿En qué carpeta lo guardaría?","Which folder would you save it in?"], cats:[["Documentos","Documents"],["Imágenes","Pictures"]], items:[
   ["Carta para el ayuntamiento.docx","Letter to the town hall.docx",0],["Foto_cumpleaños.jpg","Birthday_photo.jpg",1],["Currículum.pdf","CV.pdf",0],["Playa_Las_Canteras.png","Las_Canteras_beach.png",1],["Lista de la compra.txt","Shopping list.txt",0],["Selfie_con_mi_nieta.jpg","Selfie_with_my_granddaughter.jpg",1]]},
  quiz:[
   {q:["Lo que bajo de internet suele ir a…","What I download from the internet usually goes to…"], o:[["Descargas","Downloads"],["La Papelera","The Recycle Bin"],["La impresora","The printer"]], w:["Busque en Descargas cuando no encuentre un archivo bajado.","Look in Downloads when you cannot find a downloaded file."]},
   {q:["Para pegar uso…","To paste I use…"], o:[["Ctrl + V","Ctrl + V"],["Ctrl + Z","Ctrl + Z"],["Alt + Tab","Alt + Tab"]], w:["Ctrl + C copia y Ctrl + V pega.","Ctrl + C copies and Ctrl + V pastes."]},
   {q:["Si borro un archivo sin querer…","If I delete a file by mistake…"], o:[["Lo busco en la Papelera y lo restauro","I find it in the Recycle Bin and restore it"],["Está perdido para siempre","It is lost forever"],["Apago el ordenador","I turn off the computer"]], w:["Se puede recuperar mientras no se vacíe la Papelera.","You can recover it while the bin is not emptied."]}],
  practice:[["Abra el Explorador con Windows + E.","Open File Explorer with Windows + E."],["Entre en Documentos y cree una carpeta con su nombre.","Go into Documents and create a folder with your name."],["Copie una foto de Imágenes en su carpeta.","Copy a photo from Pictures into your folder."],["Cambie el nombre de la foto.","Rename the photo."],["Bórrela y recupérela desde la Papelera.","Delete it and recover it from the Recycle Bin."]]
},
{ id:"u7", b:"B", dev:"pc", t:["Escribir un documento","Writing a document"],
  goal:["Escribir, corregir, dar formato, guardar e imprimir un texto.","Write, correct, format, save and print a text."],
  learn:[
   {h:["Programas para escribir","Programs for writing"], p:["Se puede usar <b>Word</b> (de Microsoft), <b>Google Docs</b> (en internet, gratis con una cuenta de Google) o <b>LibreOffice Writer</b> (gratis). Todos funcionan casi igual.","You can use <b>Word</b> (by Microsoft), <b>Google Docs</b> (online, free with a Google account) or <b>LibreOffice Writer</b> (free). They all work almost the same way."]},
   {h:["Escribir y corregir","Writing and correcting"], p:["Escriba normalmente. Para pasar a otra línea pulse Enter. Si una palabra sale subrayada en rojo, puede estar mal escrita: haga clic derecho sobre ella para ver sugerencias. Si se equivoca, <b>Ctrl + Z</b> deshace lo último.","Type normally. To go to a new line press Enter. If a word is underlined in red, it may be misspelled: right-click it to see suggestions. If you make a mistake, <b>Ctrl + Z</b> undoes the last thing."]},
   {h:["Seleccionar y dar formato","Selecting and formatting"], p:["Para <b>seleccionar</b>, haga clic delante de la primera letra y arrastre hasta el final: el texto cambia de color. Un doble clic selecciona una palabra. Con el texto seleccionado: <b>N</b> = negrita, <i>K</i> = cursiva, <u>S</u> = subrayado. También puede cambiar el tamaño (el número) y el color.","To <b>select</b>, click before the first letter and drag to the end: the text changes colour. A double-click selects one word. With the text selected: <b>N</b> = bold, <i>K</i> = italics, <u>S</u> = underline (in English versions: B, I, U). You can also change the size (the number) and the colour."]},
   {h:["Guardar e imprimir","Saving and printing"], list:[
     ["Guardar:","Archivo → Guardar como → elija la carpeta → escriba el nombre → Guardar. En Word en español: Ctrl + G. Google Docs guarda solo.","Save:","File → Save as → choose the folder → type the name → Save. In Spanish Word: Ctrl + G (English: Ctrl + S). Google Docs saves by itself."],
     ["Imprimir:","Archivo → Imprimir (Ctrl + P). Elija la impresora y el número de copias.","Print:","File → Print (Ctrl + P). Choose the printer and the number of copies."]]}
  ],
  words:[["Seleccionar","Marcar un texto para cambiarlo.","Select","Mark a text to change it."],["Negrita","Letra más gruesa.","Bold","Thicker letters."],["Formato","El aspecto del texto: tamaño, color…","Format","How the text looks: size, colour…"],["Guardar como","Guardar con un nombre y una carpeta.","Save as","Save with a name and a folder."],["Deshacer","Volver atrás (Ctrl + Z).","Undo","Go back (Ctrl + Z)."],["Imprimir","Pasar el documento a papel.","Print","Put the document on paper."]],
  quiz:[
   {q:["Para deshacer el último cambio pulso…","To undo the last change I press…"], o:[["Ctrl + Z","Ctrl + Z"],["Ctrl + P","Ctrl + P"],["Enter","Enter"]], w:["Ctrl + P es imprimir.","Ctrl + P is print."]},
   {q:["Una palabra subrayada en rojo…","A word underlined in red…"], o:[["Puede estar mal escrita","May be misspelled"],["Ya está guardada","Is already saved"],["Es un enlace","Is a link"]], w:["Haga clic derecho para ver sugerencias.","Right-click to see suggestions."]},
   {q:["Para poner un título en negrita, primero…","To make a title bold, first…"], o:[["Lo selecciono","I select it"],["Lo borro","I delete it"],["Apago el ordenador","I turn off the computer"]], w:["El formato se aplica a lo seleccionado.","Formatting applies to what is selected."]}],
  practice:[["Abra Word o Google Docs.","Open Word or Google Docs."],["Escriba una nota: «Hoy no puedo ir a clase porque tengo cita médica.» y su nombre.","Type a note: «Hoy no puedo ir a clase porque tengo cita médica.» and your name."],["Escriba un título y póngalo en negrita y más grande.","Write a title and make it bold and bigger."],["Corrija las palabras subrayadas en rojo.","Correct the words underlined in red."],["Guarde el documento en su carpeta con el nombre «Nota».","Save the document in your folder with the name «Nota»."]]
},
{ id:"u8", b:"B", dev:"ambos", t:["Internet y el navegador","The internet and the web browser"],
  goal:["Buscar información, entrar en páginas web y usar pestañas y favoritos.","Search for information, visit web pages and use tabs and bookmarks."],
  learn:[
   {h:["¿Qué es internet?","What is the internet?"], p:["Es una red que une ordenadores y móviles de todo el mundo. Se conecta por wifi o por cable; el móvil también puede usar los datos de su tarifa.","It is a network that connects computers and phones all over the world. You connect by wifi or cable; a phone can also use the mobile data in its plan."]},
   {h:["El navegador","The web browser"], p:["Es el programa para ver páginas web: <b>Google Chrome</b>, <b>Microsoft Edge</b>, <b>Firefox</b> o <b>Safari</b> (en Apple). Arriba tiene la <b>barra de direcciones</b>.","It is the program to see web pages: <b>Google Chrome</b>, <b>Microsoft Edge</b>, <b>Firefox</b> or <b>Safari</b> (on Apple). At the top there is the <b>address bar</b>."]},
   {h:["Dirección o búsqueda","Address or search"], p:["En la barra de direcciones puede escribir una <b>dirección</b> exacta, como www.aemet.es, o unas <b>palabras para buscar</b>, como «farmacia de guardia Telde». Después pulse Enter.","In the address bar you can type an exact <b>address</b>, like www.aemet.es, or some <b>search words</b>, like «farmacia de guardia Telde». Then press Enter."]},
   {h:["Los resultados de Google","Google results"], p:["Google muestra una lista. Los primeros resultados a veces son anuncios: llevan la palabra «Patrocinado». Haga clic en el título azul para entrar. Para volver, pulse la flecha ← de arriba a la izquierda.","Google shows a list. The first results are sometimes adverts: they say «Patrocinado» (Sponsored). Click the blue title to go in. To go back, press the ← arrow at the top left."]},
   {h:["Pestañas, favoritos y webs oficiales","Tabs, bookmarks and official websites"], list:[
     ["Pestañas:","el + abre una pestaña nueva; la X de la pestaña la cierra.","Tabs:","+ opens a new tab; the tab's X closes it."],
     ["Favoritos:","la estrella ☆ guarda la página para encontrarla después.","Bookmarks:","the star ☆ saves the page so you can find it later."],
     ["Webs oficiales:","las del Estado suelen terminar en .gob.es y las del Gobierno de Canarias están en gobiernodecanarias.org.","Official websites:","Spanish government sites usually end in .gob.es and the Canary Islands Government is at gobiernodecanarias.org."]]}
  ],
  words:[["Internet","Red que une aparatos de todo el mundo.","Internet","A network that connects devices worldwide."],["Wifi","Conexión a internet sin cables.","Wifi","Wireless internet connection."],["Navegador","Programa para ver páginas web.","Web browser","Program to see web pages."],["Dirección web","El nombre exacto de una página: www…","Web address","The exact name of a page: www…"],["Buscador","Web para buscar, como Google.","Search engine","Website to search, like Google."],["Pestaña","Cada página abierta en el navegador.","Tab","Each page open in the browser."]],
  sort:{ask:["¿Es una dirección web o una búsqueda?","Is it a web address or a search?"], cats:[["Dirección web","Web address"],["Búsqueda","Search"]], items:[
   ["www.aemet.es","www.aemet.es",0],["tiempo mañana en Agüimes","weather tomorrow in Agüimes",1],["www.gobiernodecanarias.org","www.gobiernodecanarias.org",0],["receta de potaje de berros","watercress stew recipe",1],["www.dgt.es","www.dgt.es",0],["horario del centro de salud","health centre opening hours",1]]},
  quiz:[
   {q:["Chrome y Edge son…","Chrome and Edge are…"], o:[["Navegadores","Web browsers"],["Sistemas operativos","Operating systems"],["Correos","Email services"]], w:["Los navegadores sirven para ver páginas web.","Browsers are for viewing web pages."]},
   {q:["Un resultado con la palabra «Patrocinado» es…","A result with the word «Patrocinado» is…"], o:[["Un anuncio","An advert"],["La página oficial","The official page"],["Gratis","Free"]], w:["Puede no ser la página oficial.","It may not be the official page."]},
   {q:["Para volver a la página anterior…","To go back to the previous page…"], o:[["Pulso la flecha ← de arriba","I press the ← arrow at the top"],["Cierro el navegador","I close the browser"],["Apago el ordenador","I turn off the computer"]], w:["En el móvil también sirve el gesto o botón «atrás».","On a phone the «back» gesture or button also works."]}],
  practice:[["Abra el navegador.","Open the web browser."],["Busque «el tiempo en» y el nombre de su municipio.","Search «el tiempo en» and the name of your town."],["Escriba la dirección www.aemet.es y entre.","Type the address www.aemet.es and go in."],["Abra una pestaña nueva y busque una receta.","Open a new tab and search for a recipe."],["Guarde una página en favoritos con la estrella.","Save a page to bookmarks with the star."]]
},
{ id:"u9", b:"B", dev:"ambos", t:["El correo electrónico","Email"],
  goal:["Leer, escribir y responder correos, y enviar un archivo adjunto.","Read, write and reply to emails, and send an attachment."],
  learn:[
   {h:["¿Qué es?","What is it?"], p:["Es como una carta, pero llega al momento. Una dirección de correo tiene esta forma: <b>nombre@proveedor.com</b>, por ejemplo carmen.santana@gmail.com. Siempre lleva <b>@</b> y no tiene espacios.","It is like a letter, but it arrives instantly. An email address looks like this: <b>name@provider.com</b>, for example carmen.santana@gmail.com. It always has <b>@</b> and no spaces."]},
   {h:["Dónde se usa","Where you use it"], p:["Los más conocidos son <b>Gmail</b> (de Google), <b>Outlook</b> (de Microsoft) e <b>iCloud</b> (de Apple). Se abren en el navegador o en la app del móvil. Si tiene un móvil Android, ya tiene una cuenta de Gmail.","The best known are <b>Gmail</b> (Google), <b>Outlook</b> (Microsoft) and <b>iCloud</b> (Apple). You open them in the browser or in the phone app. If you have an Android phone, you already have a Gmail account."]},
   {h:["Leer y escribir","Reading and writing"], list:[
     ["Bandeja de entrada:","guarda los correos que recibe. Los nuevos salen en negrita.","Inbox:","keeps the emails you receive. New ones are in bold."],
     ["Redactar:","pulse Redactar o Nuevo. En «Para» escriba la dirección; en «Asunto», de qué trata; abajo, el mensaje. Pulse Enviar.","Compose:","press Compose or New. In «To» type the address; in «Subject», what it is about; below, the message. Press Send."],
     ["Adjuntar:","el clip 📎 sirve para enviar una foto o un documento.","Attach:","the paper clip 📎 is for sending a photo or document."],
     ["Responder y reenviar:","Responder contesta a quien le escribió. Reenviar manda el correo a otra persona.","Reply and forward:","Reply answers the person who wrote to you. Forward sends the email to someone else."]]},
   {h:["Correo no deseado","Spam"], p:["Los correos publicitarios o peligrosos suelen ir a la carpeta <b>Spam</b>. No abra archivos adjuntos de personas que no conoce.","Advertising or dangerous emails usually go to the <b>Spam</b> folder. Do not open attachments from people you do not know."]}
  ],
  words:[["Dirección de correo","nombre@proveedor.com","Email address","name@provider.com"],["Bandeja de entrada","Donde llegan los correos.","Inbox","Where emails arrive."],["Asunto","De qué trata el correo, en pocas palabras.","Subject","What the email is about, in a few words."],["Adjuntar","Enviar un archivo con el correo.","Attach","Send a file with the email."],["Responder","Contestar a quien le escribió.","Reply","Answer the person who wrote to you."],["Spam","Correo no deseado o peligroso.","Spam","Unwanted or dangerous email."]],
  sort:{ask:["¿La dirección de correo está bien escrita?","Is the email address written correctly?"], cats:[["Bien","Correct"],["Mal","Wrong"]], items:[
   ["pedro.ruiz@gmail.com","pedro.ruiz@gmail.com",0,"Tiene @ y no tiene espacios.","It has @ and no spaces."],["pedro ruiz@gmail.com","pedro ruiz@gmail.com",1,"Tiene un espacio.","It has a space."],["anagmail.com","anagmail.com",1,"Le falta la @.","The @ is missing."],["info@ayuntamiento.es","info@ayuntamiento.es",0,"Está bien escrita.","It is correct."],["luis@@hotmail.com","luis@@hotmail.com",1,"Tiene dos @.","It has two @."],["maria_23@outlook.es","maria_23@outlook.es",0,"Está bien escrita.","It is correct."]]},
  quiz:[
   {q:["El asunto de un correo es…","The subject of an email is…"], o:[["De qué trata el correo","What the email is about"],["La dirección","The address"],["La firma","The signature"]], w:["Escriba un asunto corto y claro.","Write a short, clear subject."]},
   {q:["El clip 📎 sirve para…","The paper clip 📎 is for…"], o:[["Adjuntar un archivo","Attaching a file"],["Borrar el correo","Deleting the email"],["Imprimir","Printing"]], w:["Con el clip se envían fotos y documentos.","With the clip you send photos and documents."]},
   {q:["Me llega un correo de un desconocido con un archivo raro…","I get an email from a stranger with a strange file…"], o:[["No lo abro","I do not open it"],["Lo abro enseguida","I open it straight away"],["Lo reenvío a todos","I forward it to everyone"]], w:["Puede tener un virus o ser un timo.","It may contain a virus or be a scam."]}],
  practice:[["Entre en su correo (Gmail u Outlook).","Open your email (Gmail or Outlook)."],["Busque la Bandeja de entrada y abra un correo.","Find the Inbox and open an email."],["Escriba un correo a su docente con el asunto «Prueba».","Write an email to your teacher with the subject «Prueba»."],["Adjunte una foto o un documento.","Attach a photo or a document."],["Envíelo y compruebe que está en «Enviados».","Send it and check that it is in «Sent»."]]
},
{ id:"u10", b:"C", dev:"movil", t:["Conocer el móvil","Getting to know your phone"], sim:"touch",
  goal:["Conocer las partes del móvil, encenderlo, desbloquearlo y usar los gestos.","Know the parts of the phone, turn it on, unlock it and use gestures."],
  learn:[
   {h:["Android e iPhone","Android and iPhone"], p:["Casi todos los móviles usan uno de estos dos sistemas: <b>Android</b> (Samsung, Xiaomi, Motorola, Oppo…) o <b>iOS</b>, el sistema del <b>iPhone</b> de Apple. Se parecen mucho; cambian algunos botones y nombres. Arriba puede elegir el suyo.","Almost all phones use one of these two systems: <b>Android</b> (Samsung, Xiaomi, Motorola, Oppo…) or <b>iOS</b>, the system of Apple's <b>iPhone</b>. They are very similar; some buttons and names change. You can choose yours above."]},
   {h:["Las partes del móvil","The parts of the phone"], img:"phone", p:["Pantalla táctil, botón de encendido en un lado, botones de volumen, cámaras delante y detrás, altavoz, micrófono y, abajo, el puerto para cargar. El icono de la batería, arriba, indica cuánta carga queda.","Touch screen, power button on one side, volume buttons, front and back cameras, speaker, microphone and, at the bottom, the charging port. The battery icon at the top shows how much charge is left."]},
   {h:["Encender y apagar","Turning on and off"],
     android:["<b>Encender:</b> mantenga pulsado el botón de encendido unos segundos. <b>Apagar:</b> mantenga pulsado el botón de encendido (en algunos Samsung, encendido y bajar volumen a la vez) y toque «Apagar».","<b>Turn on:</b> hold the power button for a few seconds. <b>Turn off:</b> hold the power button (on some Samsungs, power and volume down together) and tap «Power off»."],
     iphone:["<b>Encender:</b> mantenga pulsado el botón lateral hasta ver la manzana. <b>Apagar:</b> mantenga pulsados el botón lateral y un botón de volumen, y deslice «Deslizar para apagar».","<b>Turn on:</b> hold the side button until you see the apple. <b>Turn off:</b> hold the side button and one volume button, then drag «slide to power off»."]},
   {h:["Desbloquear","Unlocking"],
     android:["Deslice el dedo hacia arriba y ponga su PIN, su patrón o su huella.","Swipe up and enter your PIN, pattern or fingerprint."],
     iphone:["Mire la pantalla (Face ID) o ponga el dedo en el botón (Touch ID) y deslice hacia arriba. Si no funciona, escriba su código.","Look at the screen (Face ID) or put your finger on the button (Touch ID) and swipe up. If it does not work, type your passcode."]},
   {h:["Los gestos","Gestures"], list:[
     ["Tocar:","un toque suave para abrir.","Tap:","a light touch to open."],
     ["Mantener pulsado:","dejar el dedo un segundo. Salen más opciones.","Press and hold:","keep your finger down for a second. More options appear."],
     ["Deslizar:","mover el dedo por la pantalla para pasar páginas o fotos.","Swipe:","move your finger across the screen to change pages or photos."],
     ["Pellizcar:","separar dos dedos para agrandar (zoom) y juntarlos para hacerlo pequeño.","Pinch:","spread two fingers to zoom in and bring them together to zoom out."]]},
   {h:["Volver atrás e ir al inicio","Going back and going home"],
     android:["Abajo hay tres botones: ◁ atrás, ○ inicio y ▢ aplicaciones abiertas. Si no se ven, se usan gestos: deslizar desde abajo para ir al inicio y desde el borde lateral para volver atrás.","At the bottom there are three buttons: ◁ back, ○ home and ▢ open apps. If you cannot see them, use gestures: swipe up from the bottom to go home and from the side edge to go back."],
     iphone:["No hay botón atrás. Deslice desde abajo hacia arriba para ir al inicio. Para volver atrás, deslice desde el borde izquierdo o toque «<» arriba a la izquierda. Los iPhone antiguos tienen un botón redondo abajo.","There is no back button. Swipe up from the bottom to go home. To go back, swipe from the left edge or tap «<» at the top left. Older iPhones have a round button at the bottom."]}
  ],
  words:[["Pantalla táctil","Pantalla que funciona con los dedos.","Touch screen","A screen that works with your fingers."],["Desbloquear","Abrir el móvil con PIN, huella o cara.","Unlock","Open the phone with PIN, fingerprint or face."],["Pantalla de inicio","La pantalla con los iconos de las apps.","Home screen","The screen with the app icons."],["Tocar","Un toque suave con el dedo.","Tap","A light touch with your finger."],["Mantener pulsado","Dejar el dedo un segundo.","Press and hold","Keep your finger down for a second."],["Deslizar","Mover el dedo por la pantalla.","Swipe","Move your finger across the screen."]],
  quiz:[
   {q:["Para ver más opciones de un icono…","To see more options for an icon…"], o:[["Lo mantengo pulsado","I press and hold it"],["Pulso el volumen","I press the volume button"],["Apago el móvil","I turn off the phone"]], w:["Al mantener pulsado aparecen más opciones.","Pressing and holding shows more options."]},
   {q:["Para agrandar una foto…","To make a photo bigger…"], o:[["Separo dos dedos sobre la pantalla","I spread two fingers on the screen"],["Pulso el botón de encendido","I press the power button"],["Deslizo hacia abajo","I swipe down"]], w:["Es el gesto de pellizcar al revés.","It is the pinch gesture in reverse."]},
   {q:["El iPhone usa el sistema…","The iPhone uses the system…"], o:[["iOS","iOS"],["Android","Android"],["Windows","Windows"]], w:["Android lo usan Samsung, Xiaomi, Motorola y otras marcas.","Android is used by Samsung, Xiaomi, Motorola and other brands."]}],
  practice:[["Apague el móvil y vuelva a encenderlo.","Turn off your phone and turn it on again."],["Desbloquéelo.","Unlock it."],["Vaya a la pantalla de inicio.","Go to the home screen."],["Abra Galería o Fotos y agrande una foto con dos dedos.","Open Gallery or Photos and zoom in on a photo with two fingers."],["Vuelva atrás y después al inicio.","Go back and then to the home screen."]]
},
{ id:"u11", b:"C", dev:"movil", t:["Ajustes básicos del móvil","Basic phone settings"],
  goal:["Conectarse a un wifi y cambiar la letra, el sonido y la batería.","Connect to wifi and change text size, sound and battery settings."],
  learn:[
   {h:["La app Ajustes","The Settings app"],
     android:["Es el icono de una rueda dentada ⚙. Se llama «Ajustes» o «Configuración». Los menús pueden cambiar un poco según la marca.","It is the cogwheel icon ⚙. It is called «Ajustes» or «Configuración» (Settings). Menus can change a little depending on the brand."],
     iphone:["Es el icono gris de una rueda dentada ⚙ llamado «Ajustes».","It is the grey cogwheel icon ⚙ called «Ajustes» (Settings)."]},
   {h:["El panel rápido","Quick settings"],
     android:["Deslice el dedo desde arriba hacia abajo. Aparecen botones para el wifi, los datos, la linterna, el sonido y el brillo.","Swipe down from the top. Buttons appear for wifi, mobile data, torch, sound and brightness."],
     iphone:["Deslice desde la esquina de arriba a la derecha hacia abajo. Es el <b>Centro de control</b>: wifi, linterna, volumen y brillo.","Swipe down from the top right corner. This is <b>Control Centre</b>: wifi, torch, volume and brightness."]},
   {h:["Conectarse a un wifi","Connecting to wifi"],
     android:["Ajustes → Conexiones (o Redes e internet) → Wi-Fi → elija la red → escriba la contraseña → Conectar.","Settings → Connections (or Network and internet) → Wi-Fi → choose the network → type the password → Connect."],
     iphone:["Ajustes → Wi-Fi → elija la red → escriba la contraseña → Conectarse.","Settings → Wi-Fi → choose the network → type the password → Join."]},
   {h:["Letra más grande","Bigger text"],
     android:["Ajustes → Pantalla → Tamaño de fuente (el nombre puede cambiar según la marca). Mueva la barra.","Settings → Display → Font size (the name can change depending on the brand). Move the slider."],
     iphone:["Ajustes → Pantalla y brillo → Tamaño del texto. Mueva la barra.","Settings → Display & Brightness → Text Size. Move the slider."]},
   {h:["Sonido, batería y conexiones","Sound, battery and connections"], list:[
     ["Volumen:","con los botones del lado. En el panel rápido se elige sonido, vibración o silencio.","Volume:","with the side buttons. In quick settings you choose sound, vibrate or silent."],
     ["Batería:","Ajustes → Batería. Ahí se ve cuánta queda y se activa el ahorro de energía (en iPhone, «Modo de bajo consumo»).","Battery:","Settings → Battery. You can see how much is left and turn on power saving (on iPhone, «Low Power Mode»)."],
     ["Datos móviles:","si no hay wifi, el móvil usa los datos de su tarifa. Si se acaban, internet va lento.","Mobile data:","without wifi, the phone uses the data in your plan. When it runs out, the internet is slow."],
     ["Modo avión ✈:","corta las llamadas, los datos y el wifi. Sirve en el avión o para ahorrar batería.","Airplane mode ✈:","turns off calls, data and wifi. Useful on a plane or to save battery."]]}
  ],
  words:[["Ajustes","La app para cambiar cómo funciona el móvil.","Settings","The app to change how the phone works."],["Wifi","Internet sin cables de casa o del centro.","Wifi","Wireless internet at home or at school."],["Datos móviles","Internet de su tarifa del móvil.","Mobile data","Internet from your phone plan."],["Panel rápido","Botones que salen al deslizar desde arriba.","Quick settings","Buttons that appear when you swipe down."],["Brillo","La luz de la pantalla.","Brightness","How bright the screen is."],["Modo avión","Corta todas las conexiones.","Airplane mode","Turns off all connections."]],
  quiz:[
   {q:["Para conectarme al wifi del centro voy a…","To connect to the school wifi I go to…"], o:[["Ajustes → Wi-Fi","Settings → Wi-Fi"],["La cámara","The camera"],["WhatsApp","WhatsApp"]], w:["Después elija la red y escriba la contraseña.","Then choose the network and type the password."]},
   {q:["El modo avión…","Airplane mode…"], o:[["Corta las conexiones del móvil","Turns off the phone's connections"],["Carga más rápido el móvil","Charges the phone faster"],["Sube el volumen","Turns up the volume"]], w:["Con el modo avión no recibe llamadas.","In airplane mode you do not receive calls."]},
   {q:["Si veo mal la letra del móvil…","If I cannot read the phone text well…"], o:[["Agrando el tamaño de letra en Ajustes","I make the text bigger in Settings"],["Compro otro móvil","I buy another phone"],["Apago la pantalla","I turn off the screen"]], w:["Está en Ajustes → Pantalla.","It is in Settings → Display."]}],
  practice:[["Abra Ajustes.","Open Settings."],["Conéctese al wifi del aula. Su docente le dará la contraseña.","Connect to the classroom wifi. Your teacher will give you the password."],["Ponga la letra más grande y después déjela como le guste.","Make the text bigger and then leave it as you like it."],["Abra el panel rápido y encienda y apague la linterna.","Open quick settings and turn the torch on and off."],["Mire cuánta batería le queda.","Check how much battery you have left."]]
},
{ id:"u12", b:"C", dev:"movil", t:["Llamadas, contactos y WhatsApp","Calls, contacts and WhatsApp"],
  goal:["Llamar, guardar contactos y usar WhatsApp: mensajes, audios, fotos y videollamadas.","Make calls, save contacts and use WhatsApp: messages, voice notes, photos and video calls."],
  learn:[
   {h:["Llamar por teléfono","Making a phone call"],
     android:["Abra la app <b>Teléfono</b> (el auricular). Toque el teclado, marque el número y toque el botón verde.","Open the <b>Phone</b> app (the handset). Tap the keypad, dial the number and tap the green button."],
     iphone:["Abra la app <b>Teléfono</b> (el auricular verde) → Teclado → marque el número → botón verde.","Open the <b>Phone</b> app (the green handset) → Keypad → dial the number → green button."]},
   {h:["Guardar un contacto","Saving a contact"],
     android:["App <b>Contactos</b> (o Teléfono → Contactos) → botón + → escriba el nombre y el número → Guardar.","<b>Contacts</b> app (or Phone → Contacts) → + button → type the name and number → Save."],
     iphone:["Teléfono → Contactos → + (arriba a la derecha) → nombre y número → OK.","Phone → Contacts → + (top right) → name and number → Done."]},
   {h:["WhatsApp: los chats","WhatsApp: chats"], p:["Cada conversación es un <b>chat</b>. Toque un nombre para abrirlo. Abajo, escriba en la caja de texto y toque la flecha verde para enviar.","Each conversation is a <b>chat</b>. Tap a name to open it. At the bottom, type in the text box and tap the green arrow to send."]},
   {h:["Audios, fotos y videollamadas","Voice notes, photos and video calls"], list:[
     ["Nota de voz:","mantenga pulsado el micrófono 🎤 mientras habla. Al soltar, se envía. Para cancelar, deslice a la izquierda.","Voice note:","hold the microphone 🎤 while you speak. When you let go, it is sent. To cancel, slide left."],
     ["Foto:","toque el clip 📎 o el + y elija Galería/Fotos o la cámara.","Photo:","tap the clip 📎 or + and choose Gallery/Photos or the camera."],
     ["Videollamada:","dentro del chat, toque el icono de la cámara de vídeo, arriba.","Video call:","inside the chat, tap the video camera icon at the top."],
     ["Las palomitas:","✓ enviado; ✓✓ entregado; ✓✓ azules: leído (si la persona no lo ha desactivado).","Ticks:","✓ sent; ✓✓ delivered; blue ✓✓: read (unless the person has turned this off)."]]},
   {h:["Grupos y cadenas","Groups and chain messages"], p:["En los grupos escribe mucha gente a la vez. No reenvíe mensajes que piden «pásalo» sin comprobar antes si son verdad.","In groups many people write at the same time. Do not forward messages that say «pass it on» without checking first if they are true."]}
  ],
  words:[["Contacto","Nombre y número guardados en el móvil.","Contact","A name and number saved on the phone."],["Chat","Una conversación por mensajes.","Chat","A conversation by messages."],["Nota de voz","Mensaje de audio grabado.","Voice note","A recorded audio message."],["Videollamada","Llamada en la que se ven las caras.","Video call","A call where you can see faces."],["Reenviar","Mandar a otra persona un mensaje recibido.","Forward","Send a message you received to someone else."],["Grupo","Chat con muchas personas.","Group","A chat with many people."]],
  quiz:[
   {q:["Dos palomitas azules ✓✓ significan…","Two blue ticks ✓✓ mean…"], o:[["Que el mensaje se ha leído","The message has been read"],["Que no ha llegado","It has not arrived"],["Que se ha borrado","It has been deleted"]], w:["Una palomita gris es «enviado».","One grey tick means «sent»."]},
   {q:["Para enviar una nota de voz…","To send a voice note…"], o:[["Mantengo pulsado el micrófono","I hold the microphone"],["Toco la cámara","I tap the camera"],["Hago una llamada","I make a call"]], w:["Al soltar el dedo se envía.","It is sent when you lift your finger."]},
   {q:["Un mensaje dice «reenvíalo a 10 personas»…","A message says «forward this to 10 people»…"], o:[["Compruebo antes si es verdad","I check first if it is true"],["Lo reenvío rápido","I forward it quickly"],["Lo mando a todos mis grupos","I send it to all my groups"]], w:["Muchas cadenas son bulos o timos.","Many chain messages are hoaxes or scams."]}],
  practice:[["Guarde como contacto el número de un compañero o compañera.","Save a classmate's number as a contact."],["Envíele un saludo por WhatsApp.","Send them a greeting on WhatsApp."],["Envíe una nota de voz corta.","Send a short voice note."],["Envíe una foto del aula.","Send a photo of the classroom."],["Haga una videollamada corta, con su permiso.","Make a short video call, with their permission."]]
},
{ id:"u13", b:"C", dev:"movil", t:["Cámara, fotos y aplicaciones","Camera, photos and apps"],
  goal:["Hacer fotos, compartirlas, leer códigos QR e instalar aplicaciones.","Take photos, share them, read QR codes and install apps."],
  learn:[
   {h:["Hacer una foto o un vídeo","Taking a photo or video"], p:["Abra la <b>Cámara</b>. Apunte, toque la pantalla donde quiera enfocar y pulse el botón redondo grande. Para grabar, elija «Vídeo» y pulse el botón rojo; vuelva a pulsarlo para parar.","Open the <b>Camera</b>. Point, tap the screen where you want to focus and press the big round button. To record, choose «Vídeo» and press the red button; press it again to stop."]},
   {h:["Ver, compartir y borrar","Viewing, sharing and deleting"],
     android:["Las fotos están en <b>Galería</b> o <b>Google Fotos</b>. Abra una foto: el botón Compartir la envía por WhatsApp o correo; la papelera la borra (queda unos días en la papelera de la app).","Photos are in <b>Gallery</b> or <b>Google Photos</b>. Open a photo: the Share button sends it by WhatsApp or email; the bin deletes it (it stays a few days in the app's bin)."],
     iphone:["Las fotos están en la app <b>Fotos</b>. Abra una foto: el cuadrado con flecha la comparte; la papelera la borra (queda 30 días en «Eliminado»).","Photos are in the <b>Photos</b> app. Open a photo: the square with an arrow shares it; the bin deletes it (it stays 30 days in «Recently Deleted»)."]},
   {h:["La tienda de aplicaciones","The app store"],
     android:["Es la <b>Play Store</b> (el triángulo de colores). Necesita una cuenta de Google.","It is the <b>Play Store</b> (the coloured triangle). You need a Google account."],
     iphone:["Es la <b>App Store</b> (la A azul). Necesita una cuenta de Apple.","It is the <b>App Store</b> (the blue A). You need an Apple account."]},
   {h:["Instalar y quitar apps","Installing and removing apps"], p:["Abra la tienda, toque Buscar y escriba el nombre. Compruebe que es la app <b>oficial</b>: mire quién la publica y las opiniones. Toque Instalar (Android) u Obtener (iPhone). Para quitarla, mantenga pulsado el icono y elija Desinstalar o Eliminar app. Instale las actualizaciones: arreglan fallos y mejoran la seguridad.","Open the store, tap Search and type the name. Check it is the <b>official</b> app: look at who publishes it and the reviews. Tap Install (Android) or Get (iPhone). To remove it, press and hold the icon and choose Uninstall or Remove App. Install updates: they fix problems and improve security."]},
   {h:["Los códigos QR","QR codes"], p:["Abra la cámara y apunte al código. Aparece un enlace: tóquelo para abrirlo. Abra solo códigos QR de sitios de confianza.","Open the camera and point it at the code. A link appears: tap it to open it. Only open QR codes from places you trust."]}
  ],
  words:[["Galería / Fotos","App donde se guardan las fotos.","Gallery / Photos","The app where photos are kept."],["Compartir","Enviar algo a otra persona o app.","Share","Send something to another person or app."],["Play Store","Tienda de apps de Android.","Play Store","Android's app store."],["App Store","Tienda de apps del iPhone.","App Store","The iPhone's app store."],["Instalar","Poner una app nueva en el móvil.","Install","Put a new app on the phone."],["Código QR","Cuadrado de puntos que abre un enlace.","QR code","A square of dots that opens a link."]],
  quiz:[
   {q:["Para instalar apps en un iPhone uso…","To install apps on an iPhone I use…"], o:[["La App Store","The App Store"],["La Play Store","The Play Store"],["WhatsApp","WhatsApp"]], w:["La Play Store es la tienda de Android.","The Play Store is the Android store."]},
   {q:["Antes de instalar una app compruebo…","Before installing an app I check…"], o:[["Que es la oficial","That it is the official one"],["El color del icono","The colour of the icon"],["Nada","Nothing"]], w:["Hay apps falsas que copian a las de verdad.","There are fake apps that copy the real ones."]},
   {q:["Para leer un código QR uso…","To read a QR code I use…"], o:[["La cámara","The camera"],["La calculadora","The calculator"],["Los contactos","The contacts"]], w:["Apunte con la cámara y toque el enlace.","Point the camera and tap the link."]}],
  practice:[["Haga una foto del aula y otra de cerca a un objeto.","Take a photo of the classroom and a close-up of an object."],["Ábralas en Galería o Fotos y agrande una.","Open them in Gallery or Photos and zoom in on one."],["Envíe una foto por WhatsApp.","Send a photo by WhatsApp."],["Abra la tienda de aplicaciones y busque una app. Instálela solo si su docente se lo indica.","Open the app store and search for an app. Only install it if your teacher says so."],["Lea un código QR que le enseñe su docente.","Read a QR code that your teacher shows you."]]
},
{ id:"u14", b:"D", dev:"ambos", t:["Contraseñas y seguridad","Passwords and security"], sim:"password",

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
function bi(p){ if(!p) return ""; return `<span class="es">${p[0]}</span>${p[1] ? `<span class="en" lang="en">${p[1]}</span>` : ""}`; }
function rng(seed){ let h = 1779033703 ^ seed.length; for (let i=0;i<seed.length;i++){ h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  return () => { h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); h ^= h>>>16; return (h>>>0)/4294967296; }; }
function shuffle(arr, seed){ const r = rng(seed), a = arr.map((x,i)=>[x,i]); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const OK = ["✔ ¡Muy bien!","✔ Well done!"];
function okHTML(extra){ return `<span class="es">${OK[0]} ${extra ? extra[0] : ""}</span>${`<span class="en" lang="en">${OK[1]} ${extra ? extra[1] : ""}</span>`}`; }

}
