/* ---------- Fichas imprimibles ---------- */
function en(p){ return S.en && p ? `<span class="en" lang="en">${p}</span>` : ""; }
function fichaHTML(u){
  const idx = U.indexOf(u), wsh = shuffle(u.words, u.id+"w");
  let h = `<section class="ficha"><div class="f-head"><div><p class="f-eyebrow">Curso de informática básica · EIPA · Unidad ${idx+1} · ${DEV[u.dev][0]}</p><h2>${u.t[0]}</h2>${en(u.t[1])}</div><div class="f-id"><p>Nombre: ______________________</p><p>Fecha: _____________</p></div></div>`;
  h += `<h3>1. Una cada palabra con su significado. Escriba la letra.${en("Match each word with its meaning. Write the letter.")}</h3><table class="f-match">`;
  u.words.forEach((w,i)=>{ const d = wsh[i][0]; h += `<tr><td>____ ${i+1}. <b>${w[0]}</b>${en(w[2])}</td><td><b>${LETTERS[i]}.</b> ${d[1]}${en(d[3])}</td></tr>`; });
  h += `</table><h3>2. Marque la respuesta correcta.${en("Tick the correct answer.")}</h3>`;
  u.quiz.forEach((q,qi)=>{ const opts = shuffle(q.o, u.id+"q"+qi); h += `<div class="f-q"><p><b>${qi+1}.</b> ${q.q[0]}${en(q.q[1])}</p>${opts.map(([o])=>`<span class="f-opt"><span class="box">☐</span> ${o[0]}${S.en && o[1]!==o[0] ? ` <i style="color:#555">(${o[1]})</i>` : ""}</span>`).join("")}</div>`; });
  let n = 3;
  if (u.sort){ const s = u.sort; h += `<h3>${n++}. ${s.ask[0]}${en(s.ask[1])}</h3><table class="f-tbl"><tr><th></th>${s.cats.map(c=>`<th>${c[0]}${S.en&&c[1]!==c[0]?` <i style="font-weight:400">(${c[1]})</i>`:""}</th>`).join("")}</tr>${shuffle(s.items,u.id+"s").map(([it])=>`<tr><td>${it[0]}${S.en && it[1]!==it[0] ? en(it[1]) : ""}</td>${s.cats.map(()=>`<td class="box" style="text-align:center">☐</td>`).join("")}</tr>`).join("")}</table>`; }
  h += `<h3>${n++}. ${u.dev==="pc"?"En el ordenador":u.dev==="movil"?"En el móvil":"En el ordenador o el móvil"}: marque lo que sabe hacer.${en("On the device: tick what you can do.")}</h3><table class="f-tbl"><tr><th>Tarea${S.en?" <i style='font-weight:400'>(Task)</i>":""}</th><th>Solo/a${S.en?" <i style='font-weight:400'>(On my own)</i>":""}</th><th>Con ayuda${S.en?" <i style='font-weight:400'>(With help)</i>":""}</th></tr>${u.practice.map(p=>`<tr><td>${p[0]}${en(p[1])}</td><td class="box" style="text-align:center">☐</td><td class="box" style="text-align:center">☐</td></tr>`).join("")}</table>`;
  h += `<h3>${n}. Escriba una frase sobre lo que ha aprendido hoy.${en("Write a sentence about what you learned today.")}</h3><div class="f-lines"><div></div><div></div></div></section>`;
  return h;
}
function solHTML(u){
  const idx = U.indexOf(u), wsh = shuffle(u.words, u.id+"w");
  const pos = {}; wsh.forEach(([w,oi],i)=>{ pos[oi] = LETTERS[i]; });
  let h = `<div class="sol-u"><h3>Unidad ${idx+1}. ${u.t[0]}</h3><p><b>1.</b> ${u.words.map((w,i)=>`${i+1}-${pos[i]}`).join(" · ")}</p>`;
  h += `<p><b>2.</b> ${u.quiz.map((q,qi)=>{ const opts = shuffle(q.o, u.id+"q"+qi); const k = opts.findIndex(([,oi])=>oi===0); return `${qi+1}: ${q.o[0][0]} (opción ${k+1})`; }).join(" · ")}</p>`;
  if (u.sort) h += `<p><b>3.</b> ${shuffle(u.sort.items,u.id+"s").map(([it])=>`${it[0].length>40?it[0].slice(0,40)+"…":it[0]} → ${u.sort.cats[it[2]][0]}`).join(" · ")}</p>`;
  return h + `</div>`;
}
function printUnits(list){
  const pa = $("#print-area");
  pa.innerHTML = `<div class="cuaderno">${list.map(fichaHTML).join("")}<section class="ficha f-sol"><h2>Solucionario para el docente</h2><p style="margin-bottom:10px">Retire esta página antes de fotocopiar.</p>${list.map(solHTML).join("")}</section></div>`;
  document.body.classList.add("printing");
  const off = ()=>{ document.body.classList.remove("printing"); window.removeEventListener("afterprint", off); };
  window.addEventListener("afterprint", off);
  try { window.print(); } catch(e) {}
}

/* ---------- Guía y cuaderno ---------- */
function renderGuia(){
  const rows = U.map((u,i)=>`<tr><td>${i+1}</td><td>${u.t[0]}</td><td>${DEV[u.dev][0]}</td><td>${u.sim ? {mouse:"Simulador de ratón",keyboard:"Práctica de teclado",touch:"Gestos táctiles",window:"Simulador de ventanas",password:"Medidor de contraseñas"}[u.sim]+" · " : ""}${u.sort?"Clasificar · ":""}${u.quiz.length} preguntas · ${u.practice.length} tareas</td></tr>`).join("");
  return `<div class="prose">
  <h2>Guía docente</h2>
  <p>Curso de 16 unidades para alumnado adulto de EIPA que empieza desde cero en el uso del ordenador con Windows y del móvil (Android e iPhone). El lenguaje es sencillo y se dirige al alumnado de usted, como en el resto de materiales del centro. Todos los textos llevan subtítulos en inglés para el alumnado extranjero; se ocultan con el botón «English subtitles».</p>
  <h2>Cómo es cada unidad</h2>
  <ul>
   <li><b>1 · Aprendemos:</b> explicación en bloques cortos, con ilustraciones y botón «Escuchar» (lectura en voz alta en español). En el móvil, cada paso se muestra para Android o para iPhone según lo que elija el alumno o la alumna.</li>
   <li><b>2 · Palabras clave:</b> seis términos con su significado.</li>
   <li><b>3 · Practicamos aquí:</b> simulador o clasificación y preguntas con corrección inmediata y explicación.</li>
   <li><b>4 · Ahora en el aparato:</b> lista de tareas reales para hacer en el ordenador o el móvil y marcar.</li>
  </ul>
  <h2>Sesión tipo (55 minutos)</h2>
  <ul><li>10–15 min: explicación de «Aprendemos» con el proyector.</li><li>10–15 min: «Practicamos aquí» en parejas.</li><li>20–25 min: tareas en el aparato real, con apoyo.</li><li>5 min: cierre; cada persona marca «He terminado esta unidad» o completa la ficha.</li></ul>
  <p>Las unidades 2, 3, 10 y 12 suelen necesitar dos sesiones con alumnado que nunca ha usado el aparato.</p>
  <h2>Secuencia</h2>
  <p>El bloque «Lo primero» (unidades 1–3) va al principio. Los bloques del ordenador (4–9) y del móvil (10–13) pueden alternarse según el grupo; muchas personas adultas avanzan más rápido empezando por el móvil, que ya usan. El bloque «Seguridad y trámites» (14–16) puede trabajarse en cualquier momento.</p>
  <h2>Contenido</h2>
  <div class="tbl-wrap"><table class="tbl"><tr><th>Nº</th><th>Unidad</th><th>Aparato</th><th>Ejercicios</th></tr>${rows}</table></div>
  <h2>Relación con la evaluación inicial de EIPA 1</h2>
  <p>El curso trabaja los indicadores digitales de la evaluación inicial: comunicarse con dispositivos (mensajería, videollamada, correo: unidades 9 y 12), buscar información y hacer trámites en línea (unidades 8 y 16) y aplicar normas básicas de seguridad digital (unidades 14 y 15). El uso básico del ordenador (encender, abrir un documento, escribir y guardar) corresponde a las unidades 2–7.</p>
  <h2>Atención a la diversidad</h2>
  <ul><li>Botón «Letra grande» y lectura en voz alta en cada explicación.</li><li>Subtítulos en inglés para el alumnado que aún no domina el español.</li><li>Trabajo en parejas: una persona lee el paso y la otra lo hace.</li><li>Para el alumnado con lectura inicial, combinar con las <i>Fichas digitales de lectura fácil</i> de EIPA 1 (carpeta 05_Materiales).</li><li>Cada unidad tiene una ficha imprimible con autoevaluación «solo/a – con ayuda» y solucionario en página aparte.</li></ul>
  <h2>Privacidad</h2>
  <p>El progreso solo se guarda en el navegador del aparato que se usa. En las prácticas se usan datos inventados; no se deben escribir contraseñas reales en el medidor de contraseñas ni en ninguna web de práctica.</p>
  <h2>Imprimir</h2>
  <p>El botón «Imprimir ficha» de cada unidad y el «Cuaderno de fichas» funcionan al abrir el archivo del curso en el navegador del ordenador. Si el visor donde lo abre bloquea la impresión, use el PDF del cuaderno que está en la misma carpeta del curso.</p>
  </div>`;
}
function renderCuaderno(){
  return `<div class="unit-head no-print"><h1>Cuaderno de fichas</h1><p class="en">Worksheet book</p><p style="margin-top:8px">Las 16 fichas del curso y, al final, el solucionario en página aparte. ${S.en ? "Incluye los subtítulos en inglés." : "Sin subtítulos en inglés."}</p><div class="toolbar"><button class="chip" data-printall>🖨 Imprimir el cuaderno</button></div></div>
  <div class="cuaderno" style="margin-top:18px">${U.map(fichaHTML).join("")}<section class="ficha f-sol"><h2>Solucionario para el docente</h2><p style="margin-bottom:10px">Retire estas páginas antes de fotocopiar.</p>${U.map(solHTML).join("")}</section></div>`;
}

/* ---------- Router ---------- */
function route(){
  const id = (location.hash || "#inicio").slice(1);
  const u = U.find(x=>x.id===id);
  const main = $("#main");
  if (u){ main.innerHTML = renderUnit(u); main.querySelectorAll("[data-sim]").forEach(el=>SIMS[el.dataset.sim].init(el)); document.title = `${u.t[0]} · Informática básica EIPA`; }
  else if (id==="guia"){ main.innerHTML = renderGuia(); document.title = "Guía docente · Informática básica EIPA"; }
  else if (id==="cuaderno"){ main.innerHTML = renderCuaderno(); document.title = "Cuaderno de fichas · Informática básica EIPA"; }
  else { main.innerHTML = renderHome(); document.title = "Curso de Informática Básica EIPA"; }
  renderNav(u ? u.id : id);
  $("#aside").classList.remove("open"); $("#nav-toggle").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}

/* ---------- Eventos ---------- */
function applyPrefs(){
  document.body.classList.toggle("no-en", !S.en);
  document.documentElement.classList.toggle("big", S.big);
  document.body.classList.toggle("dev-android", S.device==="android");
  document.body.classList.toggle("dev-iphone", S.device==="iphone");
  $("#t-en").setAttribute("aria-pressed", S.en); $("#t-en").textContent = S.en ? "English subtitles: ON" : "English subtitles: OFF";
  $("#t-big").setAttribute("aria-pressed", S.big);
}
$("#t-en").addEventListener("click", ()=>{ S.en = !S.en; save(); applyPrefs(); if (location.hash==="#cuaderno") route(); });
$("#t-big").addEventListener("click", ()=>{ S.big = !S.big; save(); applyPrefs(); });
$("#nav-toggle").addEventListener("click", ()=>{ const a = $("#aside"); a.classList.toggle("open"); $("#nav-toggle").setAttribute("aria-expanded", a.classList.contains("open")); });
document.addEventListener("click", e=>{
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled){ const qd = opt.closest(".q"), u = U.find(x=>x.id===qd.dataset.u), q = u.quiz[+qd.dataset.q], fb = qd.querySelector(".fb");
    fb.hidden = false;
    if (opt.dataset.ok==="true"){ opt.classList.add("ok"); qd.querySelectorAll(".opt").forEach(b=>b.disabled = true); fb.className = "fb ok"; fb.innerHTML = okHTML(q.w); }
    else { opt.classList.add("bad"); fb.className = "fb bad"; fb.innerHTML = bi(["✘ No es correcto. Inténtelo otra vez.","✘ Not correct. Try again."]); }
    return; }
  const sb = e.target.closest(".sbtn");
  if (sb){ const it = sb.closest(".sort-item"); if (it.dataset.solved) return; const u = U.find(x=>x.id===it.dataset.u), item = u.sort.items[+it.dataset.i], fb = it.querySelector(".fb");
    fb.hidden = false;
    if (+sb.dataset.ci === item[2]){ sb.classList.add("ok"); it.dataset.solved = "1"; fb.className = "fb ok"; fb.innerHTML = okHTML(item[3] ? [item[3], item[4]] : null); }
    else { sb.classList.add("bad"); fb.className = "fb bad"; fb.innerHTML = bi(["✘ Piénselo otra vez.","✘ Think again."]); }
    return; }
  const dv = e.target.closest("[data-dev]");
  if (dv){ S.device = dv.dataset.dev; save(); applyPrefs(); document.querySelectorAll("[data-dev]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.dev===S.device)); return; }
  const dn = e.target.closest("[data-done]");
  if (dn){ const id = dn.dataset.done; S.done[id] = !S.done[id]; save(); route(); return; }
  const pr = e.target.closest("[data-print]");
  if (pr){ printUnits([U.find(x=>x.id===pr.dataset.print)]); return; }
  if (e.target.closest("[data-printall]")){ try { window.print(); } catch(err) {} return; }
  const ls = e.target.closest("[data-listen]");
  if (ls){ try { const box = ls.closest(".learn-text"); const txt = [...box.querySelectorAll(".es")].map(x=>x.textContent).join(". ");
      speechSynthesis.cancel(); const ut = new SpeechSynthesisUtterance(txt); ut.lang = "es-ES"; ut.rate = 0.9; speechSynthesis.speak(ut); } catch(err) {} return; }
});
document.addEventListener("change", e=>{ const c = e.target.closest("[data-check]"); if (!c) return; S.checks[c.dataset.check] = c.checked; save(); c.closest(".check").classList.toggle("on", c.checked); });
window.addEventListener("hashchange", route);
applyPrefs(); route();
</script>
